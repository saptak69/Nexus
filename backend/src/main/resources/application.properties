# Server configuration
server.port=${PORT:8080}

# Database configuration: Default to H2 file DB for instant zero-config local development,
# or override with PostgreSQL using DB_URL (e.g. DB_URL=jdbc:postgresql://localhost:5432/nexus_db)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nexus_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Enable H2 Web Console for local debugging
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Multipart file upload configuration (Universal media & docs up to 100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Storage configuration
nexus.upload.dir=${NEXUS_UPLOAD_DIR:}
nexus.storage.type=${STORAGE_TYPE:local}

# Custom JWT configuration (Zero hardcoded secrets; validated on startup)
nexus.jwt.secret=${JWT_SECRET:}
nexus.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Telegram-style OTP verification configuration
nexus.otp.dev-mode=${OTP_DEV_MODE:false}
nexus.otp.expiration-minutes=5
nexus.otp.max-attempts=5
nexus.otp.ticket-secret=${TICKET_SECRET:}
nexus.otp.ticket-expiration-minutes=10

# WebRTC & TURN configuration
nexus.webrtc.stun-servers=${STUN_SERVERS:stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302,stun:stun.cloudflare.com:3478}
nexus.webrtc.turn-server.url=${TURN_URL:}
nexus.webrtc.turn-server.secret=${TURN_SECRET:}
nexus.webrtc.turn-server.ttl-seconds=86400

# Cloudinary Storage Configuration (Optional)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.url=${CLOUDINARY_URL:}

# Spring Boot Actuator Configuration (Monitoring & Observability)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
